  <style>
    :root{--ink:#183c39;--brand:#1f8178;--soft:#e7f4f1;--line:#b9dfd9;--bg:#f5fbfa;--danger:#b64242}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Noto Sans Thai",sans-serif}.shell{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}h1{font-size:22px;margin:0 0 4px}.hint{font-size:13px;color:#54716d;margin:0 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 5px 18px #1f817812}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1}.field,label{display:block;font-size:13px;font-weight:700}.field,select,button{font:inherit}input,select{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--ink)}button{border:0;border-radius:11px;padding:11px 13px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}button.soft{background:var(--soft);color:var(--ink)}button.danger{background:#fff1f1;color:var(--danger)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tabs button{background:var(--soft);color:var(--ink);font-size:13px}.tabs button.active{background:var(--brand);color:#fff}.item{border-top:1px solid var(--line);padding:12px 0;transition:transform 180ms cubic-bezier(.2,.75,.3,1),opacity 160ms ease}.item:first-child{border-top:0}.itemHead{display:flex;align-items:flex-start;gap:12px}.itemTitle{flex:1;font-weight:700;line-height:1.35}.activeToggle{position:relative;display:inline-flex;flex:0 0 46px;width:46px;height:28px;margin:0;cursor:pointer}.activeToggle input{position:absolute;opacity:0;width:1px;height:1px;margin:0}.switchTrack{position:relative;width:46px;height:28px;border-radius:99px;background:#d8e5e3;border:1px solid #c4d9d5;transition:background 160ms ease,border-color 160ms ease}.switchTrack::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #183c3940;transition:transform 180ms cubic-bezier(.2,.8,.25,1)}.activeToggle input:checked+.switchTrack{background:var(--brand);border-color:var(--brand)}.activeToggle input:checked+.switchTrack::after{transform:translateX(18px)}.activeToggle input:focus-visible+.switchTrack{outline:3px solid #1f817855;outline-offset:2px}.meta{font-size:12px;color:#54716d;margin:4px 0 9px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:12px}.reorderMode .item{padding:9px 0;touch-action:pan-y}.reorderMode .item.dragSource{opacity:.26}.reorderRow{display:flex;align-items:center;gap:10px;min-height:42px}.dragHandle{flex:0 0 42px;width:42px;height:42px;padding:0;background:var(--soft);color:var(--ink);border:1px dashed var(--line);font-size:21px;cursor:grab;touch-action:none}.dragHandle:active{cursor:grabbing}.reorderLabel{min-width:0;font-weight:700;line-height:1.35}.dragGhost{position:fixed;z-index:20;pointer-events:none;width:var(--drag-width);padding:12px;border:1px solid var(--brand);border-radius:13px;background:#fff;box-shadow:0 14px 32px #183c3940;transform:translateY(-50%) scale(1.02);opacity:.96}.toolsMenu{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom));display:grid;gap:8px;min-width:132px;visibility:hidden;opacity:0;transform:translateY(10px) scale(.96);transform-origin:bottom right;transition:opacity 160ms ease,transform 160ms ease,visibility 160ms;z-index:4}.toolsMenu.open{visibility:visible;opacity:1;transform:translateY(0) scale(1)}.toolsMenu button{box-shadow:0 7px 18px #183c3930}.modal{position:fixed;inset:0;background:#163d3988;display:none;align-items:end;z-index:5}.modal.open{display:flex}.sheet{width:min(760px,100%);max-height:90dvh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 12px;font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.status{min-height:20px;font-size:13px;color:#54716d;margin-top:10px}.status.error{color:var(--danger)}.loadingOverlay{position:fixed;inset:0;z-index:30;overflow:auto;background:var(--bg);opacity:0;visibility:hidden;pointer-events:none;transition:opacity 180ms ease,visibility 180ms}.loadingOverlay.open{opacity:1;visibility:visible;pointer-events:auto}.loadingPage{width:min(760px,100%);min-height:100%;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom));transform:translateY(8px);transition:transform 200ms ease}.loadingOverlay.open .loadingPage{transform:translateY(0)}.loadingHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.loadingTitle{display:flex;align-items:center;gap:10px;color:#54716d;font-size:14px;font-weight:700}.loadingSpinner{width:20px;height:20px;border:3px solid #b9dfd9;border-top-color:var(--brand);border-radius:50%;animation:loadingSpin .75s linear infinite}.skeleton{overflow:hidden;position:relative;border-radius:9px;background:#e8f3f1}.skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#fff9,transparent);animation:skeletonShine 1.25s infinite}.skeletonTitle{width:148px;height:25px}.skeletonHint{width:230px;height:13px;margin-top:8px}.skeletonFab{width:108px;height:42px;border-radius:12px}.loadingCard{padding:14px;margin:12px 0;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 5px 18px #1f817812}.skeletonSelect{height:46px;width:100%}.skeletonActions,.skeletonTabs,.skeletonRow{display:flex;gap:8px}.skeletonActions{margin-top:12px}.skeletonButton{height:35px;width:86px}.skeletonTabs .skeleton{height:35px;flex:1}.skeletonList{display:grid;gap:11px;margin-top:15px}.skeletonRow{align-items:center}.skeletonBadge{width:42px;height:42px;border-radius:12px;flex:0 0 42px}.skeletonText{height:14px;flex:1}.skeletonText.short{max-width:56%}@keyframes skeletonShine{to{transform:translateX(100%)}}@keyframes loadingSpin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.loadingPage,.loadingOverlay,.skeleton::after,.loadingSpinner,.switchTrack,.switchTrack::after{transition:none;animation:none}}@media(max-width:430px){.grid{grid-template-columns:1fr}.shell{padding-inline:12px}.loadingPage{padding-inline:12px}}
    .toolsMenu.syncing{pointer-events:none;opacity:.55}#toolsFab{display:grid;place-items:center;min-width:48px;min-height:48px;padding:0;font-size:25px;line-height:1;transition:transform 160ms ease,opacity 160ms ease}#toolsFab:active{transform:scale(.94)}#toolsFab.is-syncing{cursor:wait;opacity:.9}.fabSymbol{display:inline-block;line-height:1}.is-syncing .fabSymbol{animation:fabSpin .75s linear infinite}@keyframes fabSpin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.is-syncing .fabSymbol{animation:none}}

<body>
<main class="shell">
  <h1>ตั้งค่ารายงาน</h1><p class="hint">รายการนี้เป็น config กลางของแต่ละ account</p>
  <section class="card"><label>Account<select id="account"><option>7-ELEVEN</option><option>CJ MORE</option><option>LAWSON</option><option>MINI BIG C</option><option>VILLA MARKET</option><option>LOTUS'S GO FRESH</option><option>JIFFY</option><option>TOPS DAILY</option></select></label><div class="actions" style="margin-top:10px"><button class="soft" id="update">อัปเดท</button><button class="soft" id="sync">Sync</button></div><div class="status" id="status">กำลังโหลด...</div></section>
  <section class="card"><div class="tabs"><button class="active" data-kind="sku">สินค้า</button><button data-kind="summary">หัวข้อสรุป</button><button data-kind="promotion">สื่อโปรโมชั่น</button></div><div class="row" style="margin-top:14px"><strong class="grow" id="listTitle">สินค้า</strong></div><div id="list"></div></section>
  <div class="toolsMenu" id="toolsMenu" aria-hidden="true"><button id="toolSave">SAVE</button><button class="soft" id="toolReorder">จัดเรียง</button><button class="soft" id="toolAdd">+ เพิ่ม</button><button class="danger" id="toolCancel" hidden>ยกเลิก</button></div>
  <button id="toolsFab" style="position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));box-shadow:0 8px 22px #183c3966" aria-label="เปิดเครื่องมือ" aria-expanded="false"><span class="fabSymbol" aria-hidden="true">☰</span></button>
</main>
<div class="modal" id="modal"><form class="sheet" id="form"><div class="row"><h2 class="grow" id="formTitle">เพิ่มรายการ</h2><button type="button" class="soft" id="close">ปิด</button></div><div class="grid"><label class="wide">ชื่อรายการ<input id="label" required maxlength="160"></label><label id="familyWrap">ประเภท<select id="family"><option value="SME">SME</option><option value="DEN">DEN</option></select></label><label id="categoryWrap">หมวดในฟอร์ม<select id="category" required><option value="" disabled selected>เลือกหมวดหมู่</option><option value="📍สินค้าโฟม SMOOTHE">📍สินค้าโฟม SMOOTHE</option><option value="📍สินค้าครีม SMOOTHE">📍สินค้าครีม SMOOTHE</option><option value="📍สินค้ายาสีฟัน DENTISTE">📍สินค้ายาสีฟัน DENTISTE</option><option value="📍สินค้าแปรงสีฟัน DENTISTE">📍สินค้าแปรงสีฟัน DENTISTE</option></select></label><label id="formSortWrap">ลำดับใน popup<input id="formSort" type="number" min="0" value="10"></label><label id="sortWrap">ลำดับในรายงาน<input id="sort" type="number" min="0" value="10"></label><label id="flagWrap">ค่าเริ่มต้น<select id="defaultFlag"><option value="">ว่าง</option><option value="focus">⭐</option><option value="skip">❌</option></select></label></div><div class="actions" style="margin-top:16px"><button class="grow" type="submit">บันทึก</button><button type="button" class="danger" id="remove">ลบรายการ</button></div></form></div>
<div class="loadingOverlay" id="loadingOverlay" role="status" aria-live="polite" aria-label="กำลังโหลดข้อมูลรายการ"><main class="loadingPage"><div class="loadingHeader"><div><div class="skeleton skeletonTitle"></div><div class="skeleton skeletonHint"></div></div><div class="loadingTitle"><span class="loadingSpinner"></span><span id="loadingHint">กำลังโหลด...</span></div></div><section class="loadingCard"><div class="skeleton skeletonSelect"></div><div class="skeletonActions"><div class="skeleton skeletonButton"></div><div class="skeleton skeletonButton"></div></div></section><section class="loadingCard"><div class="skeletonTabs"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><div class="skeletonList"><div class="skeletonRow"><div class="skeleton skeletonBadge"></div><div class="skeleton skeletonText"></div></div><div class="skeletonRow"><div class="skeleton skeletonBadge"></div><div class="skeleton skeletonText short"></div></div><div class="skeletonRow"><div class="skeleton skeletonBadge"></div><div class="skeleton skeletonText"></div></div><div class="skeletonRow"><div class="skeleton skeletonBadge"></div><div class="skeleton skeletonText short"></div></div><div class="skeletonRow"><div class="skeleton skeletonBadge"></div><div class="skeleton skeletonText"></div></div></div></section><div class="skeleton skeletonFab"></div></main></div>
<script src="worker-auth.js"></script>
<script src="backend-client.js"></script>
<script>
(() => {
  const API_URL = 'https://script.google.com/macros/s/AKfycbwECEynatTTsTWMMsZh2r3EO5LBQkY4IhSjziXyAxx8kdx8o-ykpZDB3EtSUpUkA_z76Q/exec';
  const USE_WORKER = new URLSearchParams(location.search).get('backend') !== 'legacy';
  const CONFIG_VERSIONS = Object.create(null);
  const ADMIN_CLIENT = USE_WORKER ? PTBackendClient.create({
    mode:'worker',
    workerUrl:PTWorkerAuth.workerUrl,
    getAuthorization:()=>PTWorkerAuth.getAuthorization('admin'),
    clearAuthorization:PTWorkerAuth.clearSession,
    legacy:{}
  }) : null;
  const $ = id => document.getElementById(id); const STORE='PT_REPORT_ADMIN_DRAFT_V1'; const ACCOUNT_STORE='PT_REPORT_ADMIN_LAST_ACCOUNT_V1'; const SKU_CATEGORIES=['📍สินค้าโฟม SMOOTHE','📍สินค้าครีม SMOOTHE','📍สินค้ายาสีฟัน DENTISTE','📍สินค้าแปรงสีฟัน DENTISTE']; let kind='sku', items=[], editing=null, syncing=false, reordering=false, dragState=null, reorderSnapshot=null; let drafts=JSON.parse(localStorage.getItem(STORE)||'{}');
  const lastAccount=localStorage.getItem(ACCOUNT_STORE);if([...$('account').options].some(option=>option.value===lastAccount))$('account').value=lastAccount;
  const BUILTIN = {
    summary: [
      ['brush_advanced_b1g1','⛔สรุปแปรงแอดวานซ์ 1แถม1'], ['brush_pack3_b1g1','⛔สรุปแปรงแพ็ค3 1แถม1'],
      ['acne_scar_5g_b1g1','⛔สรุปแอคเน่สการ์5G 1แถม1'], ['acne_gel_5g_b1g1','⛔สรุปเจลแต้มสิว5G 1แถม1'],
      ['travel_brush_set_b1g1','⛔สรุปแปรงชุดเดินทาง 1แถม1'], ['floss_b1g1','⛔สรุปไหมขัดฟัน 1แถม1'], ['dentiste_max_45g_b1g1','⛔สรุปเดนทิสเต้ MAX 45G 1แถม1']
    ],
    promotion: [
      ['sme_spot_clear_foam_40ml','⭐SME สปอตเคลียร์โฟม40มล.'], ['sme_baby_face_gel_1_5oz','⭐SME เบบี้เฟชเจลล้างหน้า 1.5oz'],
      ['den_advanced_care_toothbrush','⭐DEN แปรงสีฟันแอดวานซ์แคร์'], ['sme_sun_zero_feel_sachet','⭐SME สมูทอี ซัน ซีโร่ ฟีล(ซอง)'],
      ['sme_acne_sun_5g_sachet','⭐ SME สมูทอีแอคเน่ซัน 5g.(ซอง )'], ['sme_white_cream_5g_sachet','⭐SME ไวท์ครีม 5G. (ซอง)'], ['sme_gold_cream_5g_sachet','⭐SME โกลครีม 5G. (ซอง)']
    ]
  };
  function status(text, error=false){const el=$('status');el.textContent=text;el.className='status'+(error?' error':'');}
  function showLoading(on){$('loadingHint').textContent=on?`กำลังโหลดข้อมูล ${account()}...`:'';$('loadingOverlay').classList.toggle('open',on)}
  function jsonp(action, params={}, timeoutMs=15000){return new Promise((resolve,reject)=>{const cb='__rc_'+Date.now()+'_'+Math.random().toString(36).slice(2);const url=new URL(API_URL);url.searchParams.set('action',action);url.searchParams.set('callback',cb);Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,String(v)));const script=document.createElement('script');const timer=setTimeout(()=>done(new Error('หมดเวลารอ API')),timeoutMs);function done(err,val){clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(val)}window[cb]=v=>done(null,v);script.onerror=()=>done(new Error('เชื่อมต่อ API ไม่สำเร็จ'));script.src=url;document.head.appendChild(script);});}
  function account(){return $('account').value} function itemOrder(item){return kind==='sku'?(Number((item.data||{}).formSort)||item.sort):item.sort} function visible(){return items.filter(x=>x.kind===kind).sort((a,b)=>itemOrder(a)-itemOrder(b))} function labelForKind(){return kind==='sku'?'สินค้า':kind==='summary'?'หัวข้อสรุปท้ายงาน':'สื่อโปรโมชั่น'}
  function includeBuiltin(){for(const [type,rows] of Object.entries(BUILTIN))for(const [id,label] of rows)if(!items.some(x=>x.kind===type&&x.id===id))items.push({account:account(),kind:type,id,sort:rows.findIndex(x=>x[0]===id)+1,active:true,data:{label},builtin:true})}
  function persist(){items=items.map((item)=>({...item,account:account()}));drafts[account()]={items,updatedAt:Date.now(),requestId:drafts[account()]?.requestId||''};localStorage.setItem(STORE,JSON.stringify(drafts));status('บันทึกในเครื่องแล้ว · รอ Sync')}
  async function load(force=false){
    const currentAccount=account(),local=drafts[currentAccount];
    if(local&&!force){items=local.items||[];includeBuiltin();render();status('ใช้ draft ในเครื่อง · รอ Sync');return}
    status('กำลังโหลด...');showLoading(true);
    try{
      const r=USE_WORKER ? await ADMIN_CLIENT.getReportConfig(currentAccount) : await jsonp('getReportConfig',{account:currentAccount});
      if(!r.ok)throw Error(r.message||r.error);
      CONFIG_VERSIONS[currentAccount]=String(r.version||'');
      items=r.items||[];includeBuiltin();render();status(`พร้อมใช้งาน ${items.length} รายการ config · ${USE_WORKER?'Worker':'Legacy'}`);
    }catch(e){items=[];includeBuiltin();render();status(e.message,true)}
    finally{showLoading(false)}
  }
  function render(){ $('listTitle').textContent=labelForKind();const list=$('list');list.innerHTML='';list.classList.toggle('reorderMode',reordering);const rows=visible();if(!rows.length){list.innerHTML='<p class="hint">ยังไม่มีรายการ กด “เพิ่ม” เพื่อสร้างรายการแรก</p>';return}rows.forEach((item,index)=>{const d=item.data||{},el=document.createElement('div');el.dataset.id=item.id;const skuMeta=kind==='sku'?` · ${escape(d.family||'SME')} · ${escape(d.category||'ยังไม่กำหนดหมวด')} · ${d.defaultFlag==='focus'?'⭐':d.defaultFlag==='skip'?'❌':'ว่าง'}`:'';const disabledMeta=item.active?'':' · ปิดใช้งาน';const orderLabel=kind==='sku'?'ลำดับ popup':'ลำดับ';const checked=item.active!==false?'checked':'';const toggleLabel=item.active!==false?'ปิดใช้งานรายการ':'เปิดใช้งานรายการ';el.className='item';el.innerHTML=reordering?`<div class="reorderRow"><button class="dragHandle" data-drag="${item.id}" aria-label="ลากเพื่อจัดเรียง ${escape(d.label||item.id)}">⠿</button><div class="reorderLabel">${escape(d.label||item.id)}</div></div>`:`<div class="itemHead"><div class="itemTitle">${escape(d.label||item.id)}</div><label class="activeToggle" title="${toggleLabel}"><input type="checkbox" data-active-toggle="${item.id}" ${checked} aria-label="${toggleLabel}"><span class="switchTrack"></span></label></div><div class="meta">${orderLabel} ${itemOrder(item)}${skuMeta}${disabledMeta}</div><div class="actions"><button class="soft" data-edit="${item.id}">แก้ไข</button><button class="soft" data-move="-1" data-id="${item.id}" ${index?'':'disabled'}>ขึ้น</button><button class="soft" data-move="1" data-id="${item.id}" ${index<rows.length-1?'':'disabled'}>ลง</button></div>`;list.appendChild(el)});}
  function escape(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function setToolsOpen(on){if(syncing)on=false;$('toolsMenu').classList.toggle('open',on);$('toolsMenu').setAttribute('aria-hidden',String(!on));$('toolsFab').setAttribute('aria-expanded',String(on))}
  function setFabSyncing(on){const fab=$('toolsFab'),menu=$('toolsMenu'),symbol=fab.querySelector('.fabSymbol');fab.classList.toggle('is-syncing',on);fab.disabled=on;menu.classList.toggle('syncing',on);if(symbol)symbol.textContent=on?'⟳':'☰';fab.setAttribute('aria-label',on?'กำลัง Sync':'เปิดเครื่องมือ')}
  function setReorderMode(on){reordering=on;$('toolReorder').textContent=on?'เสร็จสิ้น':'จัดเรียง';$('toolReorder').classList.toggle('danger',on);$('toolReorder').classList.toggle('soft',!on);$('toolAdd').disabled=on;$('toolSave').disabled=on;$('toolCancel').hidden=!on;$('update').disabled=on;$('sync').disabled=on;document.querySelectorAll('[data-kind]').forEach(button=>button.disabled=on);render()}
  function flipMove(source, before){const list=$('list'),cards=[...list.querySelectorAll('.item')],first=new Map(cards.map(card=>[card,card.getBoundingClientRect()]));if(before)list.insertBefore(source,before);else list.appendChild(source);for(const card of cards){const old=first.get(card),now=card.getBoundingClientRect(),delta=old.top-now.top;if(!delta)continue;card.style.transition='none';card.style.transform=`translateY(${delta}px)`;requestAnimationFrame(()=>{card.style.transition='';card.style.transform=''})}}
  function startDrag(event){if(!reordering||event.button!==0)return;const handle=event.target.closest('[data-drag]');if(!handle)return;const source=handle.closest('.item');if(!source)return;event.preventDefault();const rect=source.getBoundingClientRect(),ghost=source.cloneNode(true);ghost.className='dragGhost';ghost.style.setProperty('--drag-width',`${rect.width}px`);ghost.style.left=`${rect.left}px`;ghost.style.top=`${event.clientY}px`;document.body.appendChild(ghost);dragState={pointerId:event.pointerId,source,ghost};try{handle.setPointerCapture(event.pointerId)}catch(_){}}
  function moveDrag(event){if(!dragState||event.pointerId!==dragState.pointerId)return;event.preventDefault();dragState.ghost.style.top=`${event.clientY}px`;if(event.clientY<80)window.scrollBy(0,-14);if(event.clientY>innerHeight-80)window.scrollBy(0,14);const others=[...$('list').querySelectorAll('.item')].filter(card=>card!==dragState.source);const before=others.find(card=>event.clientY<card.getBoundingClientRect().top+card.getBoundingClientRect().height/2);const currentNext=dragState.source.nextElementSibling;if(before!==currentNext&&before!==dragState.source)flipMove(dragState.source,before)}
  function endDrag(event){if(!dragState||event.pointerId!==dragState.pointerId)return;dragState.ghost.remove();dragState=null}
  function applyDraggedOrder(){[...$('list').querySelectorAll('.item')].forEach((card,index)=>{const item=items.find(row=>row.kind===kind&&row.id===card.dataset.id);if(!item)return;if(kind==='sku'){item.data=item.data||{};item.data.formSort=index+1}else item.sort=index+1})}
  function endActiveDrag(){if(!dragState)return;dragState.ghost.remove();dragState=null}
  async function toggleReorder(){if(!reordering){reorderSnapshot=new Map(visible().map(item=>[item.id,itemOrder(item)]));setReorderMode(true);setToolsOpen(true);status('ลากจากไอคอนหกจุดไปวางตำแหน่งใหม่ แล้วกด “เสร็จสิ้น”');return}if(dragState)return;applyDraggedOrder();reorderSnapshot=null;setReorderMode(false);persist();await sync()}
  function cancelReorder(){endActiveDrag();if(reorderSnapshot){items.filter(item=>item.kind===kind).forEach(item=>{const order=reorderSnapshot.get(item.id);if(order===undefined)return;if(kind==='sku'){item.data=item.data||{};item.data.formSort=order}else item.sort=order})}reorderSnapshot=null;setReorderMode(false);setToolsOpen(false);status('ยกเลิกการจัดเรียงแล้ว')}
  function open(item){editing=item||null;const d=item?.data||{},isSku=kind==='sku',nextSort=Math.max(0,...items.map(x=>x.sort||0))+10,nextFormSort=Math.max(0,...items.filter(x=>x.kind==='sku').map(x=>Number((x.data||{}).formSort)||x.sort||0))+10;$('formTitle').textContent=item?'แก้ไขรายการ':'เพิ่ม '+labelForKind();$('label').value=d.label||'';$('family').value=d.family||'SME';$('category').value=SKU_CATEGORIES.includes(d.category)?d.category:'';$('category').disabled=!isSku;$('formSort').value=d.formSort??(item?.sort??nextFormSort);$('formSort').disabled=!isSku;$('defaultFlag').value=d.defaultFlag||'';$('sort').value=item?.sort??nextSort;$('sort').disabled=isSku;$('remove').style.display=item?'block':'none';['familyWrap','categoryWrap','formSortWrap','flagWrap'].forEach(id=>$(id).style.display=isSku?'block':'none');$('sortWrap').style.display=isSku?'none':'block';$('modal').classList.add('open')}
  function close(){ $('modal').classList.remove('open') } function makeId(){return `${kind}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`}
  async function save(item){item.account=account();const index=items.findIndex(x=>x.kind===item.kind&&x.id===item.id);if(index<0)items.push(item);else items[index]=item;persist()}
  function sameConfig(remote, local){const key=x=>`${x.kind}:${x.id}`;const left=[...remote].sort((a,b)=>key(a).localeCompare(key(b)));const right=[...local].sort((a,b)=>key(a).localeCompare(key(b)));return left.length===right.length&&left.every((item,index)=>key(item)===key(right[index])&&item.sort===right[index].sort&&(item.active!==false)===(right[index].active!==false)&&JSON.stringify(item.data||{})===JSON.stringify(right[index].data||{}))}
  function makeRequestId(){return `rc_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,9)}`}
  async function sync(){
    if(syncing)return;
    const currentAccount=account(),local=drafts[currentAccount];
    if(!local){status('ไม่มีรายการรอ Sync');return}
    local.items=(local.items||[]).map((item)=>({...item,account:currentAccount}));
    const requestId=local.requestId||makeRequestId();
    local.requestId=requestId;drafts[currentAccount]=local;localStorage.setItem(STORE,JSON.stringify(drafts));
    syncing=true;setFabSyncing(true);
    try{
      if(USE_WORKER){
        status('กำลังส่งข้อมูลผ่าน Worker...');
        const result=await ADMIN_CLIENT.saveReportConfig(currentAccount,local.items,requestId,CONFIG_VERSIONS[currentAccount]||'');
        CONFIG_VERSIONS[currentAccount]=String(result.version||'');
        const confirmResult=await ADMIN_CLIENT.getReportConfig(currentAccount);
        if(!sameConfig(confirmResult.items||[],local.items))throw Error('ข้อมูลบน Worker ไม่ตรงกับ draft');
        CONFIG_VERSIONS[currentAccount]=String(confirmResult.version||CONFIG_VERSIONS[currentAccount]||'');
        delete drafts[currentAccount];localStorage.setItem(STORE,JSON.stringify(drafts));
        items=confirmResult.items||[];includeBuiltin();render();status('Sync แล้ว · Worker');
        return;
      }

      const payload=JSON.stringify({action:'saveReportConfigBulk',items:local.items,requestId});
      let lastError;
      for(let sendAttempt=1;sendAttempt<=3;sendAttempt++){
        status(sendAttempt===1?'กำลังส่งข้อมูล...':`กำลังส่งซ้ำ ${sendAttempt}/3...`);
        await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:payload});
        for(let checkAttempt=1;checkAttempt<=6;checkAttempt++){
          await new Promise(resolve=>setTimeout(resolve,1200));
          try{
            const meta=await jsonp('getReportConfigMeta',{account:currentAccount},25000);
            if(!meta.ok)throw Error(meta.message||'ตรวจสอบ API ไม่สำเร็จ');
            if(meta.lastRequestId!==requestId){status(`กำลังรอยืนยัน ${checkAttempt}/6...`);continue}
            status('ยืนยันข้อมูลแล้ว · กำลังโหลด...');
            const result=await jsonp('getReportConfig',{account:currentAccount},30000);
            if(!result.ok)throw Error(result.message||'โหลดข้อมูลหลัง Sync ไม่สำเร็จ');
            if(!sameConfig(result.items||[],local.items))throw Error('ข้อมูลบนเซิร์ฟเวอร์ไม่ตรงกับ draft');
            delete drafts[currentAccount];localStorage.setItem(STORE,JSON.stringify(drafts));
            items=result.items||[];includeBuiltin();render();status('Sync แล้ว · Legacy');return;
          }catch(error){lastError=error;status(`รอยืนยัน API อีกครั้ง ${checkAttempt}/6...`)}
        }
      }
      throw lastError||Error('ยังไม่ได้รับการยืนยันจาก API');
    }catch(e){
      if(e && e.code==='VERSION_CONFLICT'){
        status('มีการแก้ไข config จากที่อื่น · กดอัปเดทแล้วลองใหม่',true);
      }else{
        console.error('Report admin sync failed',e);
        status(`Sync ไม่สำเร็จ · ${e.message||'เชื่อมต่อ API ไม่ได้'} · ข้อมูลยังอยู่ในเครื่อง`,true);
      }
    }finally{syncing=false;setFabSyncing(false)}
  }
  async function importSeed(){if(!confirm(`นำเข้ารายการเดิมทั้งหมดสำหรับ ${account()}?`))return;const frame=document.createElement('iframe');frame.hidden=true;frame.src='Report.html?configSeed=1';document.body.appendChild(frame);await new Promise((resolve,reject)=>{frame.onload=resolve;setTimeout(()=>reject(Error('อ่านรายการเดิมไม่สำเร็จ')),30000)});const seed=frame.contentWindow.__PT_REPORT_CONFIG_SEED;frame.remove();if(!seed)throw Error('ไม่พบรายการเดิม');const layouts=seed.copyLayouts[account()]||[];const positions=new Map();layouts.forEach((g,gi)=>g.ids.forEach((id,si)=>positions.set(id,{category:g.heading,sort:(gi+1)*1000+si})));const applies=s=>account()==='CJ MORE'?(s.accounts||[]).includes('CJ MORE'):!(s.accounts||[]).length||(s.accounts||[]).includes(account());const rows=[];seed.skuItems.filter(applies).forEach((s,i)=>{const p=positions.get(s.id);rows.push({kind:'sku',id:s.id,sort:p?.sort??i+1,active:true,data:{label:s.label,family:s.family,category:p?.category??(s.family==='SME'?'📍SMOOTH E':'📍DENTISTE'),defaultFlag:seed.defaultFlags[s.id]||''}})});seed.summaryTopics.forEach((x,i)=>rows.push({kind:'summary',id:x.id,sort:i+1,active:true,data:{label:x.label}}));seed.promotionMediaItems.forEach((x,i)=>rows.push({kind:'promotion',id:x.id,sort:i+1,active:true,data:{label:x.label}}));for(let i=0;i<rows.length;i++){status(`กำลังนำเข้า ${i+1}/${rows.length}...`);await save(rows[i])}await load();status(`นำเข้ารายการเดิม ${rows.length} รายการแล้ว`)}
  document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{if(reordering)return;kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));render()});$('account').onchange=()=>{if(reordering)return;localStorage.setItem(ACCOUNT_STORE,account());load()};$('toolsFab').onclick=()=>setToolsOpen(!$('toolsMenu').classList.contains('open'));function closeToolsOnOutside(event){if(reordering||!$('toolsMenu').classList.contains('open'))return;if($('toolsMenu').contains(event.target)||$('toolsFab').contains(event.target))return;setToolsOpen(false)}document.addEventListener('pointerdown',closeToolsOnOutside);document.addEventListener('click',closeToolsOnOutside);$('toolAdd').onclick=()=>open(null);$('toolReorder').onclick=toggleReorder;$('toolCancel').onclick=cancelReorder;$('update').onclick=()=>drafts[account()]?status('มี draft รอ Sync กรุณา Sync ก่อน',true):load(true);$('sync').onclick=sync;$('toolSave').onclick=()=>{persist();setToolsOpen(false);sync()};$('close').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('list').addEventListener('pointerdown',startDrag);$('list').addEventListener('change',async e=>{const toggle=e.target.closest('[data-active-toggle]');if(!toggle||reordering)return;const item=items.find(row=>row.kind===kind&&row.id===toggle.dataset.activeToggle);if(!item)return;item.active=toggle.checked;await save(item);render()});document.addEventListener('pointermove',moveDrag,{passive:false});document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);$('list').onclick=async e=>{if(reordering)return;const edit=e.target.dataset.edit,id=e.target.dataset.id;if(edit)return open(items.find(x=>x.id===edit&&x.kind===kind));if(!id)return;const row=visible(),index=row.findIndex(x=>x.id===id),other=row[index+Number(e.target.dataset.move)];if(!other)return;const a=items.find(x=>x.kind===kind&&x.id===id),aOrder=itemOrder(a),otherOrder=itemOrder(other);if(kind==='sku'){a.data.formSort=otherOrder;other.data.formSort=aOrder}else{a.sort=otherOrder;other.sort= aOrder}await Promise.all([save(a),save(other)]);render()};$('form').onsubmit=async e=>{e.preventDefault();const item=editing||{account:account(),kind,id:makeId(),active:true};item.sort=item.sort??(Number($('sort').value)||0);item.data={label:$('label').value.trim(),family:$('family').value,category:$('category').value.trim(),formSort:kind==='sku'?(Number($('formSort').value)||item.sort):undefined,defaultFlag:$('defaultFlag').value};await save(item);close();render()};$('remove').onclick=()=>{if(!editing||!confirm('ลบรายการนี้?'))return;items=items.filter(x=>!(x.kind===editing.kind&&x.id===editing.id));persist();close();render()};load();
$('toolsFab').addEventListener('click',event=>event.stopPropagation());
})();
